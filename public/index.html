<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Real-time Chat Website</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f0f2f5;
    margin:0;
    padding:0;
}

/* container */
.container{
    max-width:700px;
    margin:10px auto;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    overflow:hidden;
}

/* header */
.header{
    background:#4CAF50;
    color:white;
    text-align:center;
    padding:12px;
    font-size:20px;
}

/* messages */
#messages{
    list-style:none;
    margin:0;
    padding:10px;
    height:65vh;
    overflow-y:auto;
}

#messages li{
    background:#e8f5e9;
    margin-bottom:10px;
    padding:10px;
    border-radius:8px;
    word-wrap:break-word;
}

img.chat-img{
    max-width:100%;
    display:block;
    margin-top:8px;
    border-radius:6px;
}

/* input area FIXED FOR MOBILE */
.input-area{
    display:flex;
    gap:6px;
    padding:10px;
    border-top:1px solid #ddd;
    flex-wrap:wrap;
    background:white;
}

/* input full width on mobile */
#input{
    flex:1 1 100%;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
}

/* file input */
#imageInput{
    flex:1;
    min-width:45%;
}

/* button full width on mobile */
button{
    flex:1;
    min-width:45%;
    padding:12px;
    background:#4CAF50;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:6px;
}

button:hover{
    background:#45a049;
}

/* SMALL SCREEN OPTIMIZATION */
@media (max-width: 480px) {

    #messages{
        height:60vh;
    }

    #imageInput, button{
        min-width:100%;
    }
}
</style>

</head>

<body>

<div class="container">

<div class="header">
💬 Chat Website
</div>

<ul id="messages"></ul>

<div class="input-area">

<input id="input" placeholder="Type a message...">

<input type="file" id="imageInput" accept="image/*">

<button onclick="sendMessage()">Send</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

// ask name
socket.on("ask-name", () => {
    let name = prompt("Enter your name:");
    if (!name) name = "Anonymous";
    socket.emit("set-name", name);
});

// receive messages
socket.on("chat message", (data) => {
    const li = document.createElement("li");

    li.innerHTML = `<b>${data.name}:</b> ${data.text || ""}`;

    if (data.image) {
        const img = document.createElement("img");
        img.src = data.image;
        img.className = "chat-img";
        li.appendChild(img);
    }

    const messages = document.getElementById("messages");
    messages.appendChild(li);

    messages.scrollTop = messages.scrollHeight;
});

// send message
function sendMessage() {
    const text = document.getElementById("input").value.trim();
    const file = document.getElementById("imageInput").files[0];

    if (!text && !file) return;

    if (!file) {
        socket.emit("chat message", { text });
        document.getElementById("input").value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function () {
        socket.emit("chat message", {
            text: text,
            image: reader.result
        });

        document.getElementById("input").value = "";
        document.getElementById("imageInput").value = "";
    };

    reader.readAsDataURL(file);
}
</script>

</body>
</html>
