<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Real-time Chat Website</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f0f2f5;
    margin:0;
    padding:0;
}

.container{
    max-width:700px;
    margin:20px auto;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    overflow:hidden;
}

.header{
    background:#4CAF50;
    color:white;
    text-align:center;
    padding:15px;
    font-size:24px;
}

#messages{
    list-style:none;
    margin:0;
    padding:15px;
    height:500px;
    overflow-y:auto;
}

#messages li{
    background:#e8f5e9;
    margin-bottom:10px;
    padding:10px;
    border-radius:8px;
}

img.chat-img{
    max-width:200px;
    display:block;
    margin-top:8px;
    border-radius:6px;
}

.input-area{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid #ddd;
}

#input{
    flex:1;
    padding:12px;
    font-size:16px;
}

#imageInput{
    width:120px;
}

button{
    padding:12px 20px;
    background:#4CAF50;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}
</style>

</head>

<body>

<div class="container">

<div class="header">
💬 Chat Website
</div>

<ul id="messages"></ul>

<div class="input-area">

<input id="input" placeholder="Type a message...">

<input type="file" id="imageInput" accept="image/*">

<button onclick="sendMessage()">Send</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

let username = "";

// 👇 ASK NAME WHEN SERVER REQUESTS
socket.on("ask-name", () => {
    username = prompt("Enter your name:");
    if (!username) username = "Anonymous";

    socket.emit("set-name", username);
});

// 👇 RECEIVE MESSAGES
socket.on("chat message", (data) => {
    const li = document.createElement("li");

    li.innerHTML = `<b>${data.name || "Anonymous"}:</b> ${data.text || ""}`;

    if (data.image) {
        const img = document.createElement("img");
        img.src = data.image;
        img.className = "chat-img";
        li.appendChild(img);
    }

    document.getElementById("messages").appendChild(li);
});

// 👇 SEND MESSAGE
function sendMessage() {
    const text = document.getElementById("input").value;
    const file = document.getElementById("imageInput").files[0];

    // text only
    if (!file) {
        socket.emit("chat message", {
            text: text,
            name: username
        });

        document.getElementById("input").value = "";
        return;
    }

    // image + text
    const reader = new FileReader();

    reader.onload = function () {
        socket.emit("chat message", {
            text: text,
            image: reader.result,
            name: username
        });

        document.getElementById("input").value = "";
        document.getElementById("imageInput").value = "";
    };

    reader.readAsDataURL(file);
}
</script>

</body>
</html>
