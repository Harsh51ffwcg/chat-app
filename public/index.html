<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Real-time Chat Website</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f0f2f5;
    margin:0;
    padding:0;
}

.container{
    max-width:700px;
    margin:20px auto;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    overflow:hidden;
}

.header{
    background:#4CAF50;
    color:white;
    text-align:center;
    padding:15px;
    font-size:24px;
}

#messages{
    list-style:none;
    margin:0;
    padding:15px;
    height:500px;
    overflow-y:auto;
}

#messages li{
    background:#e8f5e9;
    margin-bottom:10px;
    padding:10px;
    border-radius:8px;
}

.input-area{
    display:flex;
    padding:10px;
    border-top:1px solid #ddd;
}

#input{
    flex:1;
    padding:12px;
    font-size:16px;
}

button{
    padding:12px 20px;
    background:#4CAF50;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
💬 Chat Website
</div>

<ul id="messages"></ul>

<div class="input-area">
<input id="input" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
